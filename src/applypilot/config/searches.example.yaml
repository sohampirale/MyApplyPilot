# ApplyPilot search configuration -- Maharashtra Tech Exhaustive Sweep
# Discovers all tech, software, developer, data, AI, cloud, and engineering roles in Maharashtra.

country: "india"
country_indeed: "india"
domain: "engineering"

# Search queries -- Comprehensive Tech Roles
queries:
  # Tier 1: Freshers, Trainees & Entry Level
  - query: "Software Engineer Intern"
    tier: 1
  - query: "Graduate Engineer Trainee"
    tier: 1
  - query: "Associate Software Engineer"
    tier: 1
  - query: "Junior Software Engineer"
    tier: 1
  - query: "SDE 1"
    tier: 1
  - query: "Trainee Software Engineer"
    tier: 1
  - query: "Fresher Developer"
    tier: 1
  - query: "Off Campus Fresher"
    tier: 1

  # Tier 2: Core Software & Web Stacks
  - query: "Software Engineer"
    tier: 2
  - query: "Software Developer"
    tier: 2
  - query: "Python Developer"
    tier: 2
  - query: "Java Developer"
    tier: 2
  - query: "Full Stack Developer"
    tier: 2
  - query: "Frontend Developer"
    tier: 2
  - query: "Backend Developer"
    tier: 2
  - query: "React Developer"
    tier: 2
  - query: "Node.js Developer"
    tier: 2
  - query: ".NET Developer"
    tier: 2
  - query: "C++ Developer"
    tier: 2
  - query: "Web Developer"
    tier: 2

  # Tier 3: Pune/MH Specialty (Automotive, Embedded & Systems)
  - query: "Embedded Software Engineer"
    tier: 3
  - query: "Firmware Engineer"
    tier: 3
  - query: "IoT Engineer"
    tier: 3
  - query: "Systems Engineer"
    tier: 3
  - query: "Programmer Analyst"
    tier: 3

  # Tier 4: Data, AI, Cloud, DevOps & QA
  - query: "Data Engineer"
    tier: 4
  - query: "Data Scientist"
    tier: 4
  - query: "Data Analyst"
    tier: 4
  - query: "AI Engineer"
    tier: 4
  - query: "Machine Learning Engineer"
    tier: 4
  - query: "DevOps Engineer"
    tier: 4
  - query: "Cloud Engineer"
    tier: 4
  - query: "QA Engineer"
    tier: 4
  - query: "SDET"
    tier: 4

# Locations across Maharashtra IT clusters + Remote
locations:
  - location: "Pune, Maharashtra"
    remote: false
  - location: "Mumbai, Maharashtra"
    remote: false
  - location: "Navi Mumbai, Maharashtra"
    remote: false
  - location: "Thane, Maharashtra"
    remote: false
  - location: "Nagpur, Maharashtra"
    remote: false
  - location: "Nashik, Maharashtra"
    remote: false
  - location: "Aurangabad, Maharashtra"
    remote: false
  - location: "Kolhapur, Maharashtra"
    remote: false
  - location: "Pimpri-Chinchwad, Maharashtra"
    remote: false
  - location: "Maharashtra, India"
    remote: false
  - location: "Remote India"
    remote: true

# Glassdoor location mappings
glassdoor_location_map:
  "Pune, Maharashtra": "Pune"
  "Mumbai, Maharashtra": "Mumbai"
  "Navi Mumbai, Maharashtra": "Navi Mumbai"
  "Thane, Maharashtra": "Thane"
  "Nagpur, Maharashtra": "Nagpur"
