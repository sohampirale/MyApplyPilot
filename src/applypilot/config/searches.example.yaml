# ApplyPilot search configuration -- India Student & Entry-Level Default
# Copy to ~/.applypilot/searches.yaml and customize for your job search.
# The wizard (applypilot init) generates a basic version automatically.

# Country for Indeed/LinkedIn/Glassdoor/Naukri searches
country: "india"
country_indeed: "india"

# Search queries -- each has a query string and priority tier.
# Tier 1: Student & Fresher High-Priority Roles
# Tier 2: Core Engineering & Tech Roles
# Tier 3: General & Off-Campus Roles
queries:
  - query: "Software Engineer Intern"
    tier: 1
  - query: "Graduate Engineer Trainee"
    tier: 1
  - query: "SDE 1"
    tier: 1
  - query: "Off Campus Software Engineer 2026"
    tier: 1
  - query: "Associate Software Engineer"
    tier: 1
  - query: "Junior Software Engineer"
    tier: 2
  - query: "Junior Backend Developer"
    tier: 2
  - query: "Python Developer"
    tier: 2
  - query: "Frontend Developer"
    tier: 2
  - query: "Full Stack Developer"
    tier: 2
  - query: "Data Engineer"
    tier: 2
  - query: "DevOps Engineer"
    tier: 2
  - query: "Software Engineer"
    tier: 3
  - query: "Backend Engineer"
    tier: 3
  - query: "QA Engineer"
    tier: 3
  - query: "AI / ML Engineer"
    tier: 3

# Locations to search across Indian Tech Hubs
locations:
  - location: "Bengaluru, Karnataka"
    remote: false
  - location: "Hyderabad, Telangana"
    remote: false
  - location: "Pune, Maharashtra"
    remote: false
  - location: "Gurugram, Haryana"
    remote: false
  - location: "Noida, Uttar Pradesh"
    remote: false
  - location: "Mumbai, Maharashtra"
    remote: false
  - location: "Chennai, Tamil Nadu"
    remote: false
  - location: "Remote India"
    remote: true

# Glassdoor location mappings
glassdoor_location_map:
  "Bengaluru, Karnataka": "Bengaluru"
  "Hyderabad, Telangana": "Hyderabad"
  "Pune, Maharashtra": "Pune"
  "Gurugram, Haryana": "Gurgaon"
  "Noida, Uttar Pradesh": "Noida"
  "Mumbai, Maharashtra": "Mumbai"
  "Chennai, Tamil Nadu": "Chennai"
  "Remote India": "India"

# Location filtering -- accept/reject patterns for job location text
location:
  accept_patterns:
    - "Bengaluru"
    - "Bangalore"
    - "Hyderabad"
    - "Pune"
    - "Gurugram"
    - "Gurgaon"
    - "Noida"
    - "Mumbai"
    - "Chennai"
    - "Delhi"
    - "NCR"
    - "India"
    - "Remote"
    - "Anywhere"
  reject_patterns:
    - "United States"
    - "US"
    - "USA"
    - "Canada"
    - "London, UK"
    - "United Kingdom"
    - "Europe"

# JobSpy source boards (Naukri, LinkedIn, Indeed, Glassdoor, Google)
boards:
  - naukri
  - linkedin
  - indeed
  - glassdoor
  - google

# Search defaults
defaults:
  country: "india"
  country_indeed: "india"
  results_per_site: 100  # Max results per board per query
  hours_old: 72          # Only jobs posted within this many hours

# Negative keywords -- skip jobs with these in the title (case-insensitive)
exclude_titles:
  - "senior director"
  - "VP "
  - "vice president"
  - "chief"
  - "principal engineer"
  - "staff engineer"
  - "lead engineer"
  - "engineering manager"
  - "clearance required"
  - "TS/SCI"

